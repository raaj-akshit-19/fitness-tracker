# One address for the local stack, laid out like a Supabase project URL.
server {
    listen 80;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }
}
